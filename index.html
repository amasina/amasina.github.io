<!doctype html>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="assets/img/cover-720.webp" imagesrcset="assets/img/cover-720.webp 720w, assets/img/cover-1080.webp 1080w" imagesizes="(min-width:600px) 560px, 100vw" fetchpriority="high">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Lalezar&family=Suez+One&family=Rubik:wght@400;500&display=swap">

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
 <defs>
  <symbol id="i-ig" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".8"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
 </defs>
</svg>

<div class="page">
<div class="bar" id="bar">
 <nav class="chips" aria-label="أقسام المنيو" data-t="marketing.ui.nav_label" data-attr="aria-label"><div class="chips-track" id="chips"><span class="chip-line" aria-hidden="true"></span></div></nav>
 <button type="button" class="lt-one" id="lt-bar" lang="he" aria-label="اللغة: עברית">עברית</button>
</div>

<!-- cover poster -->
<header class="poster cover" id="top">
 <img class="pst-img" src="assets/img/cover-720.webp" srcset="assets/img/cover-720.webp 720w, assets/img/cover-1080.webp 1080w" sizes="(min-width:600px) 560px, 100vw" width="1080" height="1920" fetchpriority="high" decoding="async" alt="الشيف منصور يحمل مقلاة لحم ساخنة مع بندورة وبصل" data-t="photos.cover.alt" data-attr="alt">
 <div class="pst-shade" aria-hidden="true"></div>
 <div class="pst-logo brand"><img src="assets/logo-mark-720.webp" srcset="assets/logo-mark.webp 360w, assets/logo-mark-720.webp 720w" sizes="180px" width="720" height="472" alt="Amasina, مذاقنا على كل لسان"><span class="slogan" data-t="marketing.brand.slogan" aria-hidden="true">مذاقنا على كل لسان</span></div>
 <div class="lt lt-cover" role="group" aria-label="اللغة" data-t="marketing.ui.lang_label" data-attr="aria-label">
  <button type="button" lang="ar" data-lang="ar" aria-pressed="true">عربي</button><button type="button" lang="he" data-lang="he" aria-pressed="false">עברית</button>
 </div>
 <div class="pst-txt">
  <h1 class="pst-h hero" id="hero">مطبخ <em class="kw">الشيف منصور</em></h1>
  <p class="pst-intro" id="hero-sub">مطعم أماسينا، عين ماهل</p>
 </div>
 <a class="cue" href="#salads"><span data-t="marketing.ui.menu_label">المنيو</span><svg class="cue-chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg></a>
</header>

<main id="main">
 <!-- chef block (marketing copy; hidden when empty) -->
 <section class="chef" id="chef" aria-labelledby="chef-t" hidden>
  <h2 class="chef-t" id="chef-t"></h2>
  <p class="chef-x" id="chef-x"></p>
 </section>

 <!-- 01 salads: poster + offer -->
 <section class="sec salads" id="salads" aria-labelledby="h-salads">
  <div class="poster">
   <img class="pst-img" src="assets/img/a/pst-table-720.webp" srcset="assets/img/a/pst-table-720.webp 720w, assets/img/a/pst-table-1080.webp 1080w" sizes="(min-width:600px) 560px, 60vw" width="1080" height="1800" loading="lazy" decoding="async" alt="طاولة عليها صحون سلطات" data-t="photos.table.alt" data-attr="alt">
   <div class="pst-shade" aria-hidden="true"></div>
   <div class="pst-top" id="top-salads"></div>
   <div class="pst-txt">
    <p class="pst-kick"><span class="num">01</span><span class="rule" aria-hidden="true"></span><span data-t="sections.0.chip">سلطات</span></p>
    <h2 class="pst-h" id="h-salads" data-t="marketing.salad_offer.headline" data-rich>سلطات <em class="kw">أماسينا</em></h2>
    <p class="pst-intro" id="offer-hook" hidden></p>
   </div>
  </div>
  <div class="offer">
   <p class="offer-unit" data-t="marketing.salad_offer.pill">السعر للشخص</p>
   <div class="offer-cols">
    <div class="offer-c"><bdi dir="ltr" class="offer-n"><span class="n" data-price="0">45</span><span class="cur">₪</span></bdi>
     <span class="offer-l" data-t="marketing.salad_offer.options.0.label">عند طلب طبق رئيسي</span></div>
    <div class="offer-c"><bdi dir="ltr" class="offer-n"><span class="n" data-price="1">70</span><span class="cur">₪</span></bdi>
     <span class="offer-l" data-t="marketing.salad_offer.options.1.label">بدون طبق رئيسي</span></div>
   </div>
   <p class="offer-sub" id="offer-sub" hidden></p>
  </div>
  <h3 class="gal-title" data-t="marketing.salad_offer.gallery_title">من سلطاتنا</h3>
  <div class="gal" id="gallery"></div>
 </section>

 <div id="menu"></div>
</main>

<footer class="foot">
 <p class="foot-close" id="closing" hidden></p>
 <div class="foot-logo brand"><img src="assets/logo-mark-720.webp" srcset="assets/logo-mark.webp 360w, assets/logo-mark-720.webp 720w" sizes="260px" width="720" height="472" loading="lazy" decoding="async" alt="Amasina, مذاقنا على كل لسان"><span class="slogan" data-t="marketing.brand.slogan" aria-hidden="true">مذاقنا على كل لسان</span></div>
 <p class="foot-handle"><bdi dir="ltr">@amasena_restaurant</bdi></p>
 <div class="foot-btns">
  <a class="fbtn" id="ig" href="https://www.instagram.com/amasena_restaurant/" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-ig"/></svg><span data-t="marketing.ui.instagram">تابعونا على إنستغرام</span></a>
  <a class="fbtn" id="maps" href="https://www.google.com/maps/search/?api=1&amp;query=Amasina+restaurant+Ein+Mahel" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-pin"/></svg><span data-t="marketing.ui.location">الموقع</span></a>
 </div>
 <p class="foot-thanks" data-t="marketing.footer.thanks">صحتين وعافية</p>
</footer>
</div>

<dialog class="lb" id="lb" aria-labelledby="lb-name">
 <button type="button" class="lb-x" id="lb-x" aria-label="إغلاق"><span aria-hidden="true">×</span></button>
 <img id="lb-img" alt="" width="1080" height="1350">
 <div class="lb-txt"><h3 id="lb-name"></h3><p id="lb-desc" hidden></p></div>
</dialog>

<script src="menu-data.js"></script>
<script src="marketing-copy.js"></script>
<script src="app.js"></script>

</html>
